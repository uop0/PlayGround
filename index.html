<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Saw — @FFQPU</title>
  <meta name="description" content="The private Noir profile of @FFQPU — identity, bio, and Telegram bots." />
  <meta name="theme-color" content="#000000" />
  <meta name="color-scheme" content="dark" />

  <!-- Favicon: a small gray "F" on black (no white anywhere). -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23000000'/%3E%3Ctext x='32' y='43' font-family='Arial,sans-serif' font-size='30' font-weight='600' fill='%23a0a0a0' text-anchor='middle'%3EF%3C/text%3E%3C/svg%3E" />

  <!-- Clean Latin + Arabic typefaces. System fonts are used as a fallback. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600&amp;family=Inter:wght@300;400;500;600&amp;display=swap" rel="stylesheet" />

  <script>
    /*
     * If this tab already unlocked the site, hide the gate before first paint.
     * Keep this storage key in sync with STORAGE_KEY in the main script below.
     */
    try {
      if (sessionStorage.getItem("ffqpu:access:v1") === "granted") {
        document.documentElement.dataset.returning = "1";
        document.documentElement.dataset.auth = "1";
      }
    } catch (error) {
      /* Storage can be unavailable in private or restricted contexts. */
    }
  </script>

  <style>
    /* =========================================================
       1. DESIGN TOKENS
       Every colour is black or gray. No white is used on the page.
       ========================================================= */
    :root {
      --black: #000000;
      --surface: #050505;
      --surface-raised: #0a0a0a;
      --line: #191919;
      --line-strong: #2a2a2a;
      --line-hover: #383838;
      --text: #c9c9c9;
      --text-soft: #a0a0a0;
      --text-dim: #707070;
      --text-faint: #555555;

      --font-main: "Inter", "Cairo", system-ui, -apple-system, "Segoe UI", sans-serif;
      --font-arabic: "Cairo", "Inter", system-ui, sans-serif;
      --ease: cubic-bezier(0.22, 0.72, 0.24, 1);
    }

    /* =========================================================
       2. BASE
       ========================================================= */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: var(--black);
      -webkit-text-size-adjust: 100%;
    }

    body {
      min-height: 100svh;
      margin: 0;
      overflow-x: hidden;
      background:
        radial-gradient(ellipse 70% 46% at 50% -8%, #0d0d0d 0%, rgba(0, 0, 0, 0) 68%),
        var(--black);
      color: var(--text);
      font-family: var(--font-main);
      font-weight: 400;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    /* The hidden profile must not create a scrollbar behind the gate. */
    html:not([data-auth="1"]) body {
      overflow: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background: radial-gradient(ellipse 48% 30% at 50% 0%, rgba(201, 201, 201, 0.045), transparent 72%);
    }

    a {
      color: inherit;
    }

    button,
    input {
      font: inherit;
    }

    ::selection {
      background: #2e2e2e;
      color: var(--text);
    }

    :focus-visible {
      outline: 1px solid #4f4f4f;
      outline-offset: 3px;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
      border: 0;
    }

    /* A dark scrollbar that blends into the page. */
    html {
      scrollbar-color: #262626 var(--black);
    }

    /* =========================================================
       3. PASSWORD GATE
       ========================================================= */
    .gate {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(ellipse 55% 42% at 50% 0%, #0e0e0e 0%, rgba(0, 0, 0, 0) 70%),
        var(--black);
      transition: opacity 0.55s var(--ease), visibility 0.55s var(--ease);
    }

    .gate.is-leaving {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .gate__panel {
      width: min(100%, 420px);
      padding: 42px 36px 30px;
      border: 1px solid var(--line);
      border-radius: 24px;
      background: linear-gradient(160deg, #0b0b0b 0%, #030303 100%);
      box-shadow:
        0 32px 90px rgba(0, 0, 0, 0.9),
        inset 0 1px 0 #141414;
      transition: transform 0.55s var(--ease), opacity 0.55s var(--ease);
    }

    .gate.is-leaving .gate__panel {
      transform: translateY(-10px) scale(0.985);
      opacity: 0;
    }

    .gate__panel.is-error {
      animation: gate-shake 0.38s ease;
    }

    @keyframes gate-shake {
      0%, 100% { transform: translateX(0); }
      22% { transform: translateX(-7px); }
      44% { transform: translateX(6px); }
      66% { transform: translateX(-4px); }
      82% { transform: translateX(3px); }
    }

    .gate__mark {
      margin-bottom: 26px;
      color: var(--text-dim);
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.34em;
      text-transform: uppercase;
    }

    .gate__title {
      margin: 0 0 8px;
      color: var(--text);
      font-size: clamp(1.45rem, 6vw, 1.7rem);
      font-weight: 500;
      letter-spacing: -0.02em;
      line-height: 1.25;
    }

    .gate__note {
      margin: 0 0 26px;
      color: var(--text-dim);
      font-size: 0.84rem;
    }

    .field {
      position: relative;
    }

    .field__input {
      width: 100%;
      padding: 14px 74px 14px 16px;
      border: 1px solid var(--line-strong);
      border-radius: 12px;
      -webkit-appearance: none;
      appearance: none;
      background: var(--black);
      color: var(--text);
      caret-color: var(--text);
      font-size: 0.92rem;
      letter-spacing: 0.02em;
      transition: border-color 0.3s ease, box-shadow 0.3s ease, background 0.3s ease;
    }

    .field__input::placeholder {
      color: var(--text-faint);
    }

    .field__input:hover {
      border-color: #333333;
    }

    .field__input:focus {
      border-color: #464646;
      background: #020202;
      box-shadow: 0 0 0 3px rgba(201, 201, 201, 0.055);
      outline: none;
    }

    /* Kill the browser's bright autofill background. */
    .field__input:-webkit-autofill,
    .field__input:-webkit-autofill:hover,
    .field__input:-webkit-autofill:focus {
      -webkit-text-fill-color: var(--text);
      -webkit-box-shadow: 0 0 0 1000px var(--black) inset;
      caret-color: var(--text);
      transition: background-color 9999s ease-out;
    }

    .field__toggle {
      position: absolute;
      top: 50%;
      right: 10px;
      transform: translateY(-50%);
      padding: 6px 9px;
      border: 0;
      border-radius: 7px;
      -webkit-appearance: none;
      appearance: none;
      background: transparent;
      color: var(--text-dim);
      font-size: 0.68rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      cursor: pointer;
      transition: color 0.25s ease, background 0.25s ease;
    }

    .field__toggle:hover {
      color: var(--text-soft);
      background: #101010;
    }

    .gate__error {
      min-height: 20px;
      margin: 10px 2px 4px;
      color: var(--text-soft);
      font-size: 0.75rem;
      letter-spacing: 0.015em;
    }

    .gate__button {
      width: 100%;
      margin-top: 4px;
      padding: 13px 18px;
      border: 1px solid var(--line-strong);
      border-radius: 12px;
      -webkit-appearance: none;
      appearance: none;
      background: #121212;
      color: var(--text);
      font-size: 0.8rem;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.3s ease, border-color 0.3s ease, color 0.3s ease;
    }

    .gate__button:hover {
      border-color: var(--line-hover);
      background: #181818;
      color: #d2d2d2;
    }

    .gate__button:active {
      transform: translateY(1px);
    }

    .gate__footer {
      margin: 28px 0 0;
      padding-top: 20px;
      border-top: 1px solid #121212;
      color: var(--text-faint);
      font-size: 0.64rem;
      letter-spacing: 0.19em;
      text-align: center;
      text-transform: uppercase;
    }

    /* =========================================================
       4. ENTRY ANIMATION
       The gate fades away and the profile reveals in sequence.
       ========================================================= */
    .site {
      visibility: hidden;
      opacity: 0;
      transition: opacity 0.7s var(--ease), visibility 0.7s var(--ease);
    }

    .site.is-live {
      visibility: visible;
      opacity: 1;
    }

    [data-reveal] {
      opacity: 0;
      transform: translateY(16px);
      transition:
        opacity 0.72s var(--ease),
        transform 0.72s var(--ease);
      transition-delay: calc(var(--i, 0) * 70ms + 100ms);
    }

    .site.is-live [data-reveal] {
      opacity: 1;
      transform: translateY(0);
    }

    /* Returning visitors see the page immediately, without a flash. */
    html[data-returning="1"] .gate {
      display: none;
    }

    html[data-returning="1"] .site {
      visibility: visible;
      opacity: 1;
    }

    html[data-returning="1"] [data-reveal] {
      opacity: 1;
      transform: none;
      transition: none;
    }

    /* =========================================================
       5. PROFILE HERO
       ========================================================= */
    .shell {
      position: relative;
      z-index: 1;
      width: min(100% - 40px, 860px);
      margin: 0 auto;
      padding: clamp(38px, 8vw, 84px) 0 34px;
    }

    .profile {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    /* Landscape original photo, framed without cropping or stretching. */
    .portrait {
      position: relative;
      width: min(100%, 712px);
      margin: 0;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 24px;
      background: linear-gradient(150deg, #0b0b0b 0%, #010101 72%);
      box-shadow:
        0 30px 90px rgba(0, 0, 0, 0.85),
        inset 0 0 0 1px #101010;
      transition: border-color 0.4s ease, box-shadow 0.4s ease, transform 0.4s var(--ease);
    }

    /* Small corner details make the frame feel intentional and "noir". */
    .portrait::before,
    .portrait::after {
      content: "";
      position: absolute;
      width: 22px;
      height: 22px;
      border: 1px solid var(--line-strong);
      pointer-events: none;
      transition: border-color 0.4s ease;
    }

    .portrait::before {
      top: -1px;
      left: -1px;
      border-right: 0;
      border-bottom: 0;
      border-top-left-radius: 24px;
    }

    .portrait::after {
      right: -1px;
      bottom: -1px;
      border-top: 0;
      border-left: 0;
      border-bottom-right-radius: 24px;
    }

    .portrait:hover {
      border-color: #343434;
      box-shadow:
        0 0 46px rgba(160, 160, 160, 0.11),
        0 34px 100px rgba(0, 0, 0, 0.92);
      transform: translateY(-2px);
    }

    .portrait:hover::before,
    .portrait:hover::after {
      border-color: #4a4a4a;
    }

    .portrait img {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 16px;
      background: var(--black);
    }

    .identity {
      width: min(100%, 620px);
      margin-top: 30px;
    }

    .handle {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin: 12px 0 0;
      padding: 6px 12px;
      border: 1px solid #1c1c1c;
      border-radius: 999px;
      background: rgba(5, 5, 5, 0.8);
      color: var(--text-soft);
      font-size: 0.7rem;
      font-weight: 500;
      letter-spacing: 0.14em;
    }

    .handle__dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #7a7a7a;
      box-shadow: 0 0 9px rgba(201, 201, 201, 0.28);
      animation: soft-pulse 4.5s ease-in-out infinite;
    }

    @keyframes soft-pulse {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 1; }
    }

    .name {
      margin: 0;
      color: var(--text);
      font-size: clamp(2.55rem, 8vw, 4rem);
      font-weight: 500;
      letter-spacing: -0.045em;
      line-height: 1.05;
    }

    .bio {
      max-width: 46ch;
      margin: 13px auto 0;
      color: var(--text-soft);
      font-family: var(--font-arabic);
      font-size: clamp(0.88rem, 2.5vw, 0.98rem);
      font-weight: 300;
      letter-spacing: 0.005em;
      line-height: 1.85;
    }

    /* =========================================================
       6. BOTS
       ========================================================= */
    .bots {
      margin-top: clamp(54px, 10vw, 82px);
    }

    .section-head {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 18px;
    }

    .eyebrow {
      margin: 0 0 5px;
      color: var(--text-dim);
      font-size: 0.6rem;
      font-weight: 500;
      letter-spacing: 0.24em;
      text-transform: uppercase;
    }

    .section-title {
      margin: 0;
      color: var(--text);
      font-size: 1.42rem;
      font-weight: 500;
      letter-spacing: -0.02em;
      line-height: 1.2;
    }

    .section-note {
      margin: 0 0 4px;
      color: var(--text-dim);
      font-size: 0.72rem;
      letter-spacing: 0.02em;
      text-align: right;
    }

    .bot-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .bot {
      position: relative;
      display: grid;
      grid-template-columns: 44px minmax(0, 1fr);
      align-items: center;
      gap: 14px;
      padding: 17px 18px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: linear-gradient(155deg, #0a0a0a 0%, #030303 100%);
      color: var(--text);
      text-decoration: none;
      transition:
        border-color 0.34s ease,
        background 0.34s ease,
        box-shadow 0.34s ease,
        transform 0.34s var(--ease);
    }

    .bot:hover {
      border-color: #343434;
      background: linear-gradient(155deg, #0d0d0d 0%, #040404 100%);
      box-shadow: 0 0 32px rgba(160, 160, 160, 0.075);
      transform: translateY(-2px);
    }

    .bot:active {
      transform: translateY(0);
    }

    .bot__icon {
      display: grid;
      place-items: center;
      width: 44px;
      height: 44px;
      border: 1px solid #242424;
      border-radius: 12px;
      background: #050505;
      color: var(--text);
      transition: border-color 0.34s ease, color 0.34s ease, background 0.34s ease;
    }

    .bot:hover .bot__icon {
      border-color: #3d3d3d;
      background: #080808;
      color: #d2d2d2;
    }

    .bot__icon svg {
      width: 20px;
      height: 20px;
    }

    .bot__body {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .bot__index {
      margin-bottom: 2px;
      color: var(--text-dim);
      font-size: 0.56rem;
      font-weight: 500;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    .bot__id {
      overflow: hidden;
      color: var(--text);
      font-size: 0.9rem;
      font-weight: 400;
      letter-spacing: 0.005em;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .bot__open {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      margin-top: 4px;
      color: var(--text-soft);
      font-size: 0.66rem;
      letter-spacing: 0.06em;
      transition: color 0.3s ease;
    }

    .bot__open svg {
      width: 12px;
      height: 12px;
      transition: transform 0.3s var(--ease);
    }

    .bot:hover .bot__open {
      color: var(--text);
    }

    .bot:hover .bot__open svg {
      transform: translate(2px, -2px);
    }

    /* =========================================================
       7. FOOTER
       ========================================================= */
    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-top: clamp(52px, 9vw, 78px);
      padding-top: 22px;
      border-top: 1px solid #141414;
      color: var(--text-faint);
      font-size: 0.66rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .footer__sep {
      color: #3d3d3d;
    }

    /* =========================================================
       8. RESPONSIVE
       ========================================================= */
    @media (max-width: 700px) {
      .shell {
        width: min(100% - 32px, 860px);
      }

      .portrait {
        padding: 7px;
        border-radius: 20px;
      }

      .portrait img {
        border-radius: 13px;
      }

      .section-head {
        align-items: flex-start;
        flex-direction: column;
        gap: 8px;
      }

      .section-note {
        text-align: left;
      }

      .bot-grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 420px) {
      .gate {
        padding: 18px;
      }

      .gate__panel {
        padding: 34px 22px 24px;
        border-radius: 20px;
      }

      /* 16px prevents iOS from zooming in when the field is focused. */
      .field__input {
        font-size: 16px;
      }

      .bot {
        grid-template-columns: 40px minmax(0, 1fr);
        gap: 12px;
        padding: 15px;
      }

      .bot__icon {
        width: 40px;
        height: 40px;
      }

      .footer {
        align-items: flex-start;
        flex-direction: column;
        gap: 5px;
      }

      .footer__sep {
        display: none;
      }
    }

    /* Respect users who prefer no motion. */
    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.001ms !important;
        scroll-behavior: auto !important;
      }

      .gate__panel.is-error {
        animation: none;
      }
    }
  </style>
</head>
<body>
  <!-- =======================================================
       PASSWORD GATE
       ======================================================= -->
  <div class="gate" id="gate" role="dialog" aria-modal="true" aria-labelledby="gate-title">
    <div class="gate__panel" id="gate-panel">
      <p class="gate__mark">FFQPU / Private</p>
      <h1 class="gate__title" id="gate-title">Private access</h1>
      <p class="gate__note">Enter the password to continue.</p>

      <form id="gate-form" novalidate>
        <label class="sr-only" for="password">Password</label>
        <div class="field">
          <input
            class="field__input"
            id="password"
            name="password"
            type="password"
            placeholder="Password"
            autocomplete="current-password"
            autocapitalize="off"
            spellcheck="false"
            aria-describedby="gate-error"
            required
            autofocus
          />
          <button class="field__toggle" id="toggle-password" type="button" aria-label="Show password">Show</button>
        </div>

        <p class="gate__error" id="gate-error" role="alert" aria-live="polite"></p>
        <button class="gate__button" type="submit">Unlock</button>
      </form>

      <p class="gate__footer">@FFQPU &middot; Restricted</p>
    </div>
  </div>

  <!-- =======================================================
       PROFILE SITE
       ======================================================= -->
  <div class="site" id="site" aria-hidden="true">
    <main class="shell">
      <header class="profile">
        <!-- The supplied image is embedded as a data URI so the page stays a single file. -->
        <figure class="portrait" data-reveal style="--i: 0">

      JavaScript is required to unlock this profile.
    </p>
  </noscript>

  <script>
    "use strict";

    /* =========================================================
       CONFIGURATION — edit these values and publish.
       ========================================================= */

    /*
     * PASSWORD
     * Change this one value to set a new site password.
     * Note: this is a client-side gate for presentation, not server-grade security.
     */
    const SITE_PASSWORD = "FFQPU";

    /* Keep in sync with the key used in the <head> script. */
    const STORAGE_KEY = "ffqpu:access:v1";

    /*
     * PROFILE
     * Name and bio are taken from the public Telegram preview:
     * https://t.me/FFQPU
     *
     * To use a different photo, paste a direct image URL into PHOTO_URL.
     * Leave it empty to use the embedded original Pinterest image.
     */
    const PROFILE = {
      displayName: "Saw",
      username: "@FFQPU",
      bio: "Beware my silence more than my anger.",
      photoUrl: ""
    };

    /*
     * BOTS
     * Add, remove, or reorder entries here. The username is used for
     * both the visible ID and the https://t.me/<username> link.
     */
    const BOTS = [
      { label: "Bot 01", username: "FFQPU0bot" },
      { label: "Bot 02", username: "SawPython_bot" },
      { label: "Bot 03", username: "SSQXEbot" },
      { label: "Bot 04", username: "FFQPU177bot" }
    ];

    /* =========================================================
       ELEMENTS
       ========================================================= */
    const gate = document.getElementById("gate");
    const gatePanel = document.getElementById("gate-panel");
    const gateForm = document.getElementById("gate-form");
    const passwordInput = document.getElementById("password");
    const togglePassword = document.getElementById("toggle-password");
    const gateError = document.getElementById("gate-error");
    const site = document.getElementById("site");
    const profilePhoto = document.getElementById("profile-photo");
    const displayName = document.getElementById("display-name");
    const username = document.getElementById("username");
    const bio = document.getElementById("bio");
    const botGrid = document.getElementById("bot-grid");
    const year = document.getElementById("year");

    /* =========================================================
       PROFILE + BOTS RENDERING
       ========================================================= */

    /** Small inline robot icon, drawn in the current text colour. */
    const BOT_ICON = `
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="4" y="7" width="16" height="12" rx="4"></rect>
        <path d="M12 3v4"></path>
        <circle cx="9" cy="12.5" r="0.9" fill="currentColor" stroke="none"></circle>
        <circle cx="15" cy="12.5" r="0.9" fill="currentColor" stroke="none"></circle>
        <path d="M9 16.5h6"></path>
      </svg>`;

    /** Small diagonal arrow used by the "Open Bot" action. */
    const ARROW_ICON = `
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M4 12 12 4"></path>
        <path d="M6 4h6v6"></path>
      </svg>`;

    function renderProfile() {
      displayName.textContent = PROFILE.displayName;
      username.textContent = PROFILE.username;
      bio.textContent = PROFILE.bio;
      profilePhoto.alt = `Profile picture of ${PROFILE.username}`;

      if (PROFILE.photoUrl) {
        profilePhoto.src = PROFILE.photoUrl;
      }
    }

    function renderBots() {
      BOTS.forEach((bot, index) => {
        const card = document.createElement("a");
        card.className = "bot";
        card.href = `https://t.me/${bot.username}`;
        card.target = "_blank";
        card.rel = "noopener noreferrer";
        card.dataset.reveal = "";
        card.style.setProperty("--i", String(5 + index));
        card.setAttribute("aria-label", `Open Bot ${bot.username} on Telegram`);

        card.innerHTML = `
          <span class="bot__icon" aria-hidden="true">${BOT_ICON}</span>
          <span class="bot__body">
            <span class="bot__index">${bot.label}</span>
            <span class="bot__id">@${bot.username}</span>
            <span class="bot__open">Open Bot ${ARROW_ICON}</span>
          </span>`;

        botGrid.appendChild(card);
      });
    }

    /* =========================================================
       PASSWORD GATE LOGIC
       ========================================================= */
    function showError(message) {
      gateError.textContent = message;
      gatePanel.classList.remove("is-error");
      void gatePanel.offsetWidth; /* Restart the shake animation. */
      gatePanel.classList.add("is-error");
      passwordInput.setAttribute("aria-invalid", "true");
    }

    function clearError() {
      gateError.textContent = "";
      passwordInput.removeAttribute("aria-invalid");
      gatePanel.classList.remove("is-error");
    }

    function unlockSite() {
      clearError();
      document.documentElement.dataset.auth = "1";

      try {
        sessionStorage.setItem(STORAGE_KEY, "granted");
      } catch (error) {
        /* The site still opens for this page view if storage is blocked. */
      }

      site.setAttribute("aria-hidden", "false");
      site.classList.add("is-live");
      gate.classList.add("is-leaving");

      window.setTimeout(() => {
        gate.hidden = true;
      }, 600);
    }

    gateForm.addEventListener("submit", (event) => {
      event.preventDefault();

      if (!passwordInput.value) {
        showError("Enter the password to continue.");
        passwordInput.focus();
        return;
      }

      if (passwordInput.value === SITE_PASSWORD) {
        unlockSite();
        return;
      }

      showError("Incorrect password. Try again.");
      passwordInput.select();
      passwordInput.focus();
    });

    passwordInput.addEventListener("input", clearError);

    togglePassword.addEventListener("click", () => {
      const isHidden = passwordInput.type === "password";
      passwordInput.type = isHidden ? "text" : "password";
      togglePassword.textContent = isHidden ? "Hide" : "Show";
      togglePassword.setAttribute("aria-label", isHidden ? "Hide password" : "Show password");
      passwordInput.focus();
    });

    /* =========================================================
       BOOT
       ========================================================= */
    renderProfile();
    renderBots();
    year.textContent = String(new Date().getFullYear());

    const returning = document.documentElement.dataset.returning === "1";
    if (returning) {
      site.classList.add("is-live");
      site.setAttribute("aria-hidden", "false");
      gate.hidden = true;
    } else {
      /* Focus the field once the browser has painted the gate. */
      window.setTimeout(() => passwordInput.focus({ preventScroll: true }), 150);
    }
  </script>
</body>
</html>
