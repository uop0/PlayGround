{% extends "base.html" %}
{% block content %}
<section class="tool-hero glass">
  <span class="badge {{ tool.badge_class }}">{{ tool.badge }}</span>
  <h1><i class="{{ tool.icon }}"></i> {{ tool.ar }}</h1>
  <p class="tool-en font-mono">{{ tool.en }}</p>
  <p>{{ tool.desc }}</p>
</section>
<section class="tool-box glass">
  <div class="row wrap">
    <label class="lbl inline">الطول: <b id="pw-len-val" class="font-mono">16</b>
      <input id="pw-len" type="range" min="4" max="64" value="16" oninput="document.getElementById('pw-len-val').textContent=this.value" />
    </label>
  </div>
  <div class="checks">
    <label><input type="checkbox" id="pw-upper" checked /> أحرف كبيرة A-Z</label>
    <label><input type="checkbox" id="pw-lower" checked /> أحرف صغيرة a-z</label>
    <label><input type="checkbox" id="pw-digits" checked /> أرقام 0-9</label>
    <label><input type="checkbox" id="pw-symbols" checked /> رموز !@#</label>
  </div>
  <div class="row">
    <button class="btn btn-neon" onclick="doPassword()"><i class="fa-solid fa-key"></i> توليد كلمة مرور</button>
    <button class="btn btn-mini" onclick="copyText('pw-out')"><i class="fa-solid fa-copy"></i> نسخ</button>
  </div>
  <label class="lbl">كلمة المرور</label>
  <input id="pw-out" class="inp mono-ltr big-pass" readonly placeholder="…" />
  <div id="pw-strength" class="status"></div>
</section>
{% endblock %}
{% block scripts %}
<script>
async function doPassword(){
  const r = await api('/api/password', {
    length: parseInt(document.getElementById('pw-len').value, 10),
    upper: document.getElementById('pw-upper').checked,
    lower: document.getElementById('pw-lower').checked,
    digits: document.getElementById('pw-digits').checked,
    symbols: document.getElementById('pw-symbols').checked,
  });
  if(r.ok){
    document.getElementById('pw-out').value = r.result;
    document.getElementById('pw-strength').innerHTML = '<span class="ok-pill">القوة: ' + escapeHtml(r.strength) + '</span>';
    autoCopy(r.result);
  } else toast(r.error || 'خطأ', 'error');
}
doPassword();
</script>
{% endblock %}
