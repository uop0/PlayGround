{% extends "base.html" %}
{% block content %}
<section class="tool-hero glass">
  <span class="badge {{ tool.badge_class }}">{{ tool.badge }}</span>
  <h1><i class="{{ tool.icon }}"></i> {{ tool.ar }}</h1>
  <p class="tool-en font-mono">{{ tool.en }}</p>
  <p>{{ tool.desc }}</p>
</section>
<section class="tool-box glass">
  <label class="lbl">النص المراد تشفيره (Hash)</label>
  <input id="hash-in" class="inp mono-ltr" placeholder="اكتب أي نص…" oninput="doHash()" />
  <div class="row">
    <button class="btn btn-neon" onclick="doHash()"><i class="fa-solid fa-fingerprint"></i> توليد البصمات</button>
    <button class="btn btn-mini" onclick="clearAll(['hash-in'])"><i class="fa-solid fa-eraser"></i> مسح</button>
  </div>
  <div class="hash-grid">
    <div class="hash-row"><b class="font-mono">MD5</b><code id="h-md5" class="mono-ltr">…</code><button class="btn btn-mini" onclick="copyEl('h-md5')">نسخ</button></div>
    <div class="hash-row"><b class="font-mono">SHA1</b><code id="h-sha1" class="mono-ltr">…</code><button class="btn btn-mini" onclick="copyEl('h-sha1')">نسخ</button></div>
    <div class="hash-row"><b class="font-mono">SHA256</b><code id="h-sha256" class="mono-ltr">…</code><button class="btn btn-mini" onclick="copyEl('h-sha256')">نسخ</button></div>
    <div class="hash-row"><b class="font-mono">SHA512</b><code id="h-sha512" class="mono-ltr">…</code><button class="btn btn-mini" onclick="copyEl('h-sha512')">نسخ</button></div>
  </div>
</section>
{% endblock %}
{% block scripts %}
<script>
async function doHash(){
  const text = document.getElementById('hash-in').value;
  if(!text) return;
  const r = await api('/api/hash', {text});
  if(r.ok){
    document.getElementById('h-md5').textContent = r.md5;
    document.getElementById('h-sha1').textContent = r.sha1;
    document.getElementById('h-sha256').textContent = r.sha256;
    document.getElementById('h-sha512').textContent = r.sha512;
  }
}
</script>
{% endblock %}
